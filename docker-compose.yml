services:
  postgres:
    image: postgres:16-alpine
    container_name: hr-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr_portal}
      POSTGRES_USER: ${POSTGRES_USER:-hr_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr_portal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build:
      context: ./docker/php
    container_name: hr-portal-php
    restart: unless-stopped
    # var/ is written by php-fpm (www-data) but the bind mount is created by root
    command: sh -c "mkdir -p var/referrals && chmod -R a+rwX var && exec php-fpm"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-changeme}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hr_portal}:${POSTGRES_PASSWORD:-hr_portal}@postgres:5432/${POSTGRES_DB:-hr_portal}?serverVersion=16&charset=utf8
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://localhost:5173$}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-%kernel.project_dir%/config/jwt/private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-%kernel.project_dir%/config/jwt/public.pem}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-changeme}
      JWT_TOKEN_TTL: ${JWT_TOKEN_TTL:-3600}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: hr-portal-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  node:
    image: node:20-alpine
    container_name: hr-portal-node
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${APP_URL:-http://localhost:8000}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
