name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (PHPStan + PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hr_portal
          POSTGRES_USER: hr_portal
          POSTGRES_PASSWORD: hr_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr_portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hr_portal:hr_portal@127.0.0.1:5432/hr_portal?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, zip, mbstring, ctype, iconv
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Static analysis (PHPStan)
        run: |
          bin/console cache:warmup
          vendor/bin/phpstan analyse --no-progress

      - name: Generate JWT keypair
        run: bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Prepare test database
        env:
          APP_ENV: test
        run: |
          bin/console doctrine:database:create --if-not-exists
          bin/console doctrine:migrations:migrate --no-interaction

      - name: Run PHPUnit
        run: bin/phpunit

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check and build
        run: npm run build
